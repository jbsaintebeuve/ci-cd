name: Build, Test and Deploy React Application

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm ci, build and test
        run: |
          npm ci
          npm run jsdoc
          npm run build --if-present
          npm test
      - name: npm ci and test
        run: |
          npm ci
          npm test
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: Check package versions
        id: check-version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")

          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          echo "remote_version=$REMOTE_VERSION" >> $GITHUB_OUTPUT

          echo "Version locale : $LOCAL_VERSION"
          echo "Version distante (NPM) : $REMOTE_VERSION"
      - name: build and publish package on NPM
        if: steps.check-version.outputs.local_version != steps.check-version.outputs.remote_version
        run: |
          npm run build-npm-ci
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Deploy job
  deploy:
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{steps.pages.outputs.page_url}}
    runs-on: ubuntu-latest
    # Grant GITHUB_TOKEN the permissions required to make a page deployment
    permissions:
      pages: write
      id-token: write
    # Add a dependency to the build job
    needs: build_test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend -f Dockerfile.react .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend -f server/Dockerfile.server .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
      - name: Start docker compose
        run: docker compose -p ci-cd up -d
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          max_wait=180
          elapsed=0
          while [ $elapsed -lt $max_wait ]; do
            db_status=$(docker inspect --format '{{json .State.Health.Status}}' ci-cd-db-1 2>/dev/null || echo '"unavailable"')
            adminer_status=$(docker inspect --format '{{json .State.Health.Status}}' ci-cd-adminer-1 2>/dev/null || echo '"unavailable"')
            server_status=$(docker inspect --format '{{json .State.Health.Status}}' ci-cd-server-1 2>/dev/null || echo '"unavailable"')
            react_status=$(docker inspect --format '{{json .State.Status}}' ci-cd-react-1 2>/dev/null || echo '"unavailable"')
            echo "[$elapsed s] db=$db_status adminer=$adminer_status server=$server_status react=$react_status"
            if [ "$db_status" = '"healthy"' ] && [ "$adminer_status" = '"healthy"' ] && [ "$server_status" = '"healthy"' ] && [ "$react_status" = '"running"' ]; then
              echo "All services are healthy!"
              break
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done
          if [ $elapsed -ge $max_wait ]; then
            echo "Timeout waiting for services!"
            docker compose -p ci-cd logs
            exit 1
          fi
      - name: List running containers
        run: docker ps
      - name: Check db health
        run: docker inspect --format '{{json .State.Health.Status}}' ci-cd-db-1 | jq '. == "healthy"'
      - name: Check adminer health
        run: docker inspect --format '{{json .State.Health.Status}}' ci-cd-adminer-1 | jq '. == "healthy"'
      - name: Check server health
        run: docker inspect --format '{{json .State.Health.Status}}' ci-cd-server-1 | jq '. == "healthy"'
      - name: Check react status
        run: docker inspect --format '{{json .State.Status}}' ci-cd-react-1
