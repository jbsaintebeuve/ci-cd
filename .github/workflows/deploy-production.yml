name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-vercel:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: npm ci
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uv
        run: pip install uv
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  publish-npm:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: npm ci
        run: npm ci
      - name: authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: Check package versions
        id: check-version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")

          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          echo "remote_version=$REMOTE_VERSION" >> $GITHUB_OUTPUT

          echo "Version locale : $LOCAL_VERSION"
          echo "Version distante (NPM) : $REMOTE_VERSION"
      - name: build and publish package on NPM
        if: steps.check-version.outputs.local_version != steps.check-version.outputs.remote_version
        run: |
          npm run build-npm-ci
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend -f Dockerfile.react .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend -f server/Dockerfile.server .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend
      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
      - name: Start docker compose
        run: docker compose -p ci-cd up -d
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          max_wait=180
          elapsed=0
          while [ $elapsed -lt $max_wait ]; do
            db_status=$(docker inspect --format '{{json .State.Health.Status}}' ci-cd-db-1 2>/dev/null || echo '"unavailable"')
            adminer_status=$(docker inspect --format '{{json .State.Health.Status}}' ci-cd-adminer-1 2>/dev/null || echo '"unavailable"')
            server_status=$(docker inspect --format '{{json .State.Health.Status}}' ci-cd-server-1 2>/dev/null || echo '"unavailable"')
            react_status=$(docker inspect --format '{{json .State.Status}}' ci-cd-react-1 2>/dev/null || echo '"unavailable"')
            echo "[$elapsed s] db=$db_status adminer=$adminer_status server=$server_status react=$react_status"
            if [ "$db_status" = '"healthy"' ] && [ "$adminer_status" = '"healthy"' ] && [ "$server_status" = '"healthy"' ] && [ "$react_status" = '"running"' ]; then
              echo "All services are healthy!"
              break
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done
          if [ $elapsed -ge $max_wait ]; then
            echo "Timeout waiting for services!"
            docker compose -p ci-cd logs
            exit 1
          fi
      - name: List running containers
        run: docker ps
      - name: Check db health
        run: docker inspect --format '{{json .State.Health.Status}}' ci-cd-db-1 | jq '. == "healthy"'
      - name: Check adminer health
        run: docker inspect --format '{{json .State.Health.Status}}' ci-cd-adminer-1 | jq '. == "healthy"'
      - name: Check server health
        run: docker inspect --format '{{json .State.Health.Status}}' ci-cd-server-1 | jq '. == "healthy"'
      - name: Check react status
        run: docker inspect --format '{{json .State.Status}}' ci-cd-react-1
